# Rebuilds the static site into docs/ (what GitHub Pages serves) whenever source
# changes land on main. This is what makes CMS edits publish: Pages CMS commits a
# Markdown post, this workflow rebuilds docs/ and commits it back, and the live
# site updates without anyone running a build locally.
name: Build docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit rebuilt docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes."
          else
            git commit -m "chore: rebuild docs [skip ci]"
            git push
          fi
