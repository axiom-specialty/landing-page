<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axiom Specialty</title>
    <!--
      GitHub Pages SPA fallback. GitHub Pages serves this file for any unknown
      path; the script re-encodes the path into a query string and redirects to
      the app root, where index.html decodes it back into a clean URL.
      pathSegmentsToKeep = 0 because the site is served from the custom-domain
      root (axiomspecialty.com). Set it to 1 for a GitHub Pages project subpath.
      See https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        var pathSegmentsToKeep = 0;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
